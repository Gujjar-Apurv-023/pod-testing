apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker

spec:
  replicas: 2 # Now we can scale safely with Redis!

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
        - name: worker
          image: apurv023/preview-worker:v24
          ports:
            - containerPort: 3001

          env:
            - name: NODE_ENV
              value: production
            - name: REDIS_URL
              value: redis://redis-service:6379
            - name: POOL_MAX
              value: "4"
            
            # The Downward API: Let the pod know its own IP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          resources:
            limits:
              cpu: "2000m"
              memory: "4Gi"
            requests:
              cpu: "1000m"
              memory: "2Gi"

          securityContext:
            runAsUser: 1000 
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false