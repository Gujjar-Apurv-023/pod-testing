apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker

spec:
  replicas: 2

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
        - name: worker
          image: apurv023/preview-worker:v5

          ports:
            - containerPort: 3001

          env:
            - name: NODE_ENV
              value: production

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"

            limits:
              cpu: "4000m"
              memory: "4Gi"

          securityContext:
            runAsUser: 1000 
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false